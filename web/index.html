<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#087F83">
  <meta name="description" content="Clinic Solution - a fast, cross-platform clinic management solution.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clinic Solution">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-orbyteza.png"/>

  <link rel="icon" type="image/svg+xml" sizes="any" href="clinic-solution.svg?v=orbyteza-2026">
  <title>orByteza Clinic Solution</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #F0F6F5; }
    #loading {
      align-items: center;
      color: #087F83;
      display: flex;
      flex-direction: column;
      font: 600 18px system-ui, sans-serif;
      gap: 16px;
      height: 100%;
      justify-content: center;
    }
    .spinner {
      animation: spin 0.8s linear infinite;
      border: 4px solid #D9E5E5;
      border-top-color: #087F83;
      border-radius: 50%;
      height: 36px;
      width: 36px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="clinic-solution.svg" width="80" height="80" alt="Clinic Solution logo">
    <div class="spinner" aria-hidden="true"></div>
    <span>Opening Clinic Solution…</span>
    <small style="font-size:12px;color:#536F73;text-align:center;padding:16px">© 2026 ORBYTEZA TECH LLP. All rights reserved.</small>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
