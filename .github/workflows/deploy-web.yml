name: Deploy clinic web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: clinic-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.0
  CPANEL_HOST: sh016.hostgator.in
  CPANEL_PORT: 22
  CPANEL_USER: mobituvx
  CPANEL_DOMAIN: clinic.mobitab.co.in

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: |
          flutter build web --release --base-href /
          cp web/.htaccess build/web/.htaccess
          printf '%s\n' "$GITHUB_SHA" > build/web/deployment.txt

      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing CPANEL_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$SSH_KEY_PASSPHRASE" || { echo "Missing CPANEL_SSH_KEY_PASSPHRASE secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing CPANEL_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/cpanel_askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/cpanel_askpass
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/cpanel_askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/cpanel_deploy < /dev/null
          rm -f ~/.ssh/cpanel_askpass

      - name: Resolve cPanel document root
        shell: bash
        run: |
          sftp_command=(
            sftp
            -b -
            -P "$CPANEL_PORT"
            -o IdentityAgent="$SSH_AUTH_SOCK"
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            "$CPANEL_USER@$CPANEL_HOST"
          )
          live_main="/tmp/clinic-live-main-${GITHUB_RUN_ID}.js"
          curl --fail --location --show-error --silent \
            "https://$CPANEL_DOMAIN/main.dart.js?run=$GITHUB_RUN_ID" \
            --output "$live_main"
          live_hash="$(sha256sum "$live_main" | cut -d ' ' -f 1)"
          candidates=(
            "/home2/$CPANEL_USER/public_html/clinic"
            "/home2/$CPANEL_USER/$CPANEL_DOMAIN"
            "/home2/$CPANEL_USER/public_html/$CPANEL_DOMAIN"
            "/home2/$CPANEL_USER/clinic"
          )
          matches=()
          for index in "${!candidates[@]}"; do
            candidate="${candidates[$index]}"
            candidate_main="/tmp/clinic-candidate-${GITHUB_RUN_ID}-${index}.js"
            if printf 'get %s/main.dart.js %s\n' "$candidate" "$candidate_main" | \
                "${sftp_command[@]}" > /dev/null 2>&1; then
              candidate_hash="$(sha256sum "$candidate_main" | cut -d ' ' -f 1)"
              if [[ "$candidate_hash" == "$live_hash" ]]; then
                matches+=("$candidate")
              fi
            fi
          done
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "Expected one cPanel directory matching the production app, found ${#matches[@]}." >&2
            exit 1
          fi
          document_root="${matches[0]}"
          case "$document_root" in
            "/home2/$CPANEL_USER/"*) ;;
            *) echo "Refusing unexpected document root: $document_root" >&2; exit 1 ;;
          esac
          printf 'CPANEL_PATH=%s/\n' "$document_root" >> "$GITHUB_ENV"
          printf 'Deploying %s to %s\n' "$CPANEL_DOMAIN" "$document_root"

      - name: Deploy to cPanel
        shell: bash
        run: |
          {
            printf 'cd %s\n' "$CPANEL_PATH"
            printf 'put -r build/web/* .\n'
            printf 'put build/web/.htaccess .htaccess\n'
          } | sftp \
              -b - \
              -P "$CPANEL_PORT" \
              -o IdentityAgent="$SSH_AUTH_SOCK" \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              "$CPANEL_USER@$CPANEL_HOST"
      - name: Verify production website
        shell: bash
        run: |
          production_sha="$(curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --show-error \
            --silent \
            "https://$CPANEL_DOMAIN/deployment.txt?run=$GITHUB_RUN_ID")"
          test "$production_sha" = "$GITHUB_SHA" || {
            echo "Production commit mismatch: expected $GITHUB_SHA, received $production_sha" >&2
            exit 1
          }
