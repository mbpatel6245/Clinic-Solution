name: Deploy clinic web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: clinic-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7
  CPANEL_HOST: sh016.hostgator.in
  CPANEL_PORT: 22
  CPANEL_USER: mobituvx
  CPANEL_PATH: /home2/mobituvx/clinic/

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: |
          flutter build web --release --base-href /
          cp web/.htaccess build/web/.htaccess

      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing CPANEL_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$SSH_KEY_PASSPHRASE" || { echo "Missing CPANEL_SSH_KEY_PASSPHRASE secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing CPANEL_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/cpanel_askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/cpanel_askpass
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/cpanel_askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/cpanel_deploy < /dev/null
          rm -f ~/.ssh/cpanel_askpass

      - name: Deploy to cPanel
        run: |
          rsync \
            --archive \
            --compress \
            --delete-delay \
            --delay-updates \
            --exclude='.well-known/' \
            --exclude='.ftpquota' \
            -e "ssh -i ~/.ssh/cpanel_deploy -p $CPANEL_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            build/web/ \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_PATH"

      - name: Verify production website
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --show-error \
            --silent \
            https://clinic.mobitab.co.in/ > /dev/null
